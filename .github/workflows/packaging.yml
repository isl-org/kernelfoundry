name: Packaging

# Asserts that an installed wheel is self-sufficient: it carries its own hydra configs and needs
# no `.project-root` marker. Without this, the regression is invisible in a checkout and only
# surfaces for users who `pip install kernelfoundry` -- which is how it shipped before, and how it
# came back within days of being fixed.
#
# Deliberately narrow: only tests/test_installed_paths.py runs here. The rest of the suite needs a
# GPU, a toolchain and an LLM key, so it cannot run on a hosted runner.

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    types: [opened, synchronize, ready_for_review]

permissions:
  contents: read

jobs:
  wheel-is-self-sufficient:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel

      - name: Install it into a clean environment
        # No extras on purpose: this has to hold for the smallest possible install. hydra-core and
        # omegaconf are the only additions, because config composition is what is being asserted.
        run: |
          python -m venv /tmp/kfvenv
          /tmp/kfvenv/bin/python -m pip install --upgrade pip
          /tmp/kfvenv/bin/python -m pip install dist/*.whl hydra-core omegaconf

      - name: The installed package finds its own configs
        # Run from a directory with no .project-root anywhere above it, which is what a user has.
        working-directory: /tmp
        run: |
          /tmp/kfvenv/bin/python - <<'PY'
          from hydra import compose, initialize_config_dir
          from kernelfoundry import CONFIG_DIR

          assert (CONFIG_DIR / "run.yaml").is_file(), f"run.yaml is missing from {CONFIG_DIR}"
          with initialize_config_dir(version_base="1.3", config_dir=str(CONFIG_DIR)):
              cfg = compose(config_name="run")
          assert "branches_per_iteration" in cfg, "run.yaml did not compose"
          print(f"composed run.yaml from {CONFIG_DIR}")
          PY

      - name: The console script is installed
        run: test -x /tmp/kfvenv/bin/kernelfoundry-gui

      - name: Shipped configs and autoroot guards
        # From /tmp with an absolute path, so `import kernelfoundry` resolves to the installed
        # package rather than the checkout sitting in the working directory.
        working-directory: /tmp
        run: /tmp/kfvenv/bin/python -m pytest "$GITHUB_WORKSPACE/tests/test_installed_paths.py" -q
