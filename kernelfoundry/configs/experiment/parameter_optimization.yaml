# @package _global_
defaults:
  - override /paths: default
  - override /database: evolve_db_optimization_aware
  - override /prompt: default
  - override /task_set: default

job_name: templated_on_top_sycl_l2

language: SYCL
gpu_arch: lnl

inference:
  _target_: kernelfoundry.algorithm.inference_server.LLMEnsemble
  servers:
    - _target_: kernelfoundry.algorithm.inference_server.InferenceServer
      server_type: openai
      model_name: gpt-4o
      temperature: 0.3
      num_completions: 1
      max_tokens: 6500
    - _target_: kernelfoundry.algorithm.inference_server.InferenceServer
      server_type: openai
      model_name: gpt-5.2
      temperature: 0.3
      num_completions: 1
      max_tokens: 6500
  weights: uniform

task_set:
  level: 2
  use_representative: True

max_iters: 3
stop_once_correct: False
  
# # use this to evaluate a working kernel from another run:
kernels_iter_0_path: "best-paper_sycl_wotemplated_l2"

# Enable templated kernels
prompt:
  diff_format: False
  template:
    allow_templated: True
    prompt_template_fn: "param_optim_prompt.j2"

store_generated_kernels_in_db: true

branches_per_iteration: 8

devices:
 - 0