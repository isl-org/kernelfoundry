task_name: gemm_cm # name for the kernel generation task
job_name: gemm_cm_bmg # a name for the specific job you want to run, e.g. optimizing for Battlemage

gpu_arch: bmg # Short name of the target architecture, here battlemage
language: CM # The target language (CM = C for Metal)

# CM kernels are compiled JIT by clops via clBuildProgram(-cmc),
# so no AOT build step is needed.
has_build_step: false
has_reference_build_step: false
