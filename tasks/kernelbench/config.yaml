job_name: job_name_PLACEHOLDER # A name for the job, e.g., experiment name or model name
task_name: Op_name_PLACEHOLDER # Long name for task
Op_ID: Op_ID_PLACEHOLDER # Short name or numeric code for operation
gpu_arch: gpu_arch_PLACEHOLDER # Short name of the target architecture
language: language_PLACEHOLDER # The target language
level: level_PLACEHOLDER

task_origin: KernelBench

test_reference: true # If true will run the tests and profiling for the reference too

has_reference_build_step: false # In KernelBench all references are pytorch code

hyperparameters:
  # build-time parameters are passed to the build function in task.py
  buildtime: null
  # runtime parameters are passed to pytest as --runtime_params, JSON-encoded. Read them in a
  # test with request.config.getoption("--runtime_params"), or with
  # kernelfoundry.conftest.get_runtime_params_from_argv() outside a fixture
  runtime: null